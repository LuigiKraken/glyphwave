# sway (and other wlroots compositors with swayidle): add to ~/.config/sway/config.
# The screensaver closes before swaylock, which glyphwave can't see on the bus.

exec swayidle -w \
    timeout 300 'glyphwave-idle' \
    timeout 900 'glyphwave-idle --stop; swaylock -f' \
    before-sleep 'glyphwave-idle --stop; swaylock -f'

for_window [app_id="glyphwave"] fullscreen enable
for_window [class="glyphwave"] fullscreen enable
