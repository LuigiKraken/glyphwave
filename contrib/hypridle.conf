# Hyprland: add to ~/.config/hypr/hypridle.conf (glyphwave on $PATH). `glyphwave setup`
# prints these lines with your times and the full path filled in.
# With more than one screen glyphwave opens a window on each by itself
# (hyprctl dispatch with a monitor rule); `screens = main` in its config
# turns the others black.
# glyphwave wakes itself on input, so there's no on-resume: that would also
# fire on the music keys, which are meant to leave it running.

general {
    # close the screensaver first: hyprlock isn't on the bus, so glyphwave
    # wouldn't notice it and would keep drawing underneath
    lock_cmd = glyphwave launch --stop; pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 300                   # 5 min
    on-timeout = glyphwave launch
}

# Hyprland restarts the idle count when glyphwave's window opens, so this one
# counts from there: it locks 10 min after glyphwave starts. It has to be
# longer than the one above, or it comes first.
listener {
    timeout = 600                   # 10 min
    on-timeout = loginctl lock-session
}

# To start hypridle and bind the start-now key, in hyprland.lua (Hyprland 0.56 on):
#   hl.on("hyprland.start", function () hl.exec_cmd("hypridle") end)
#   hl.bind("SUPER + CTRL + L", hl.dsp.exec_cmd("glyphwave launch --now"))
# or in hyprland.conf:
#   exec-once = hypridle
#   bind = SUPER CTRL, L, exec, glyphwave launch --now
#
# For terminals that can't start fullscreen themselves (wezterm):
#   hl.window_rule({ name = "glyphwave", match = { class = "^glyphwave$" }, fullscreen = true })
#   windowrule = fullscreen on, match:class ^(glyphwave)$      (hyprland.conf, 0.53 on)
#   windowrulev2 = fullscreen, class:^(glyphwave)$              (hyprland.conf, before 0.53)
# For then = screen-off, the second listener's on-timeout is
#   hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'   (or `hyprctl dispatch dpms off` without a hyprland.lua)
# with on-resume the same with "on".
